spring:
  application:
    name: ledgerguard
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ledgerguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:ledgerguard}
    password: ${DB_PASSWORD:ledgerguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
