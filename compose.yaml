services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ledgerguard
      MYSQL_USER: ledgerguard
      MYSQL_PASSWORD: ledgerguard
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ledgerguard-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ledgerguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ledgerguard
      DB_PASSWORD: ledgerguard
    ports:
      - "8080:8080"

volumes:
  ledgerguard-mysql:
